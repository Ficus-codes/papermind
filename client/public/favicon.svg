<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191B1C"/>
      <stop offset="100%" stop-color="#101112"/>
    </linearGradient>

    <!-- Left Wing Face Gradient -->
    <linearGradient id="leftWing" x1="12" y1="14" x2="31" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DFDC"/>
    </linearGradient>

    <!-- Left Wing Underfold (Shadowed Depth) -->
    <linearGradient id="leftFold" x1="16" y1="34" x2="31" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2BEB9"/>
      <stop offset="100%" stop-color="#9E9A95"/>
    </linearGradient>

    <!-- Right Wing Face Gradient (Slightly warmer lighting) -->
    <linearGradient id="rightWing" x1="52" y1="14" x2="33" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#D9D5D0"/>
    </linearGradient>

    <!-- Right Wing Underfold (Shadowed Depth) -->
    <linearGradient id="rightFold" x1="48" y1="34" x2="33" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8B4AF"/>
      <stop offset="100%" stop-color="#918D88"/>
    </linearGradient>

    <!-- Radiant Amber Spine Glow Filter -->
    <filter id="amberGlow" x="18" y="4" width="28" height="56" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Neural Apex Spark Gradient -->
    <linearGradient id="amberCore" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC15E"/>
      <stop offset="40%" stop-color="#FF9A2E"/>
      <stop offset="100%" stop-color="#E67E00"/>
    </linearGradient>
  </defs>

  <!-- Base Architectural Rounded Tile -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Central Amber Ambiance Aura -->
  <circle cx="32" cy="30" r="16" fill="#FF9A2E" opacity="0.14" filter="blur(8px)"/>

  <!-- LEFT WING (Open Manuscript Folio - Primary Facet) -->
  <polygon points="12,20 27,14 30.5,35 16,42" fill="url(#leftWing)"/>
  <!-- Left Wing Underfold (Geometric Origami Crease) -->
  <polygon points="16,42 30.5,35 30.5,49" fill="url(#leftFold)"/>

  <!-- RIGHT WING (Open Manuscript Folio - Symmetrical Facet) -->
  <polygon points="52,20 37,14 33.5,35 48,42" fill="url(#rightWing)"/>
  <!-- Right Wing Underfold (Geometric Origami Crease) -->
  <polygon points="48,42 33.5,35 33.5,49" fill="url(#rightFold)"/>

  <!-- Paper Spine Hairline Seams -->
  <line x1="27" y1="14" x2="30.5" y2="35" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
  <line x1="37" y1="14" x2="33.5" y2="35" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>

  <!-- CENTRAL AMBER SPARK & SYNTHESIS QUILL (The Mind) -->
  <g filter="url(#amberGlow)">
    <!-- Vertical Glowing Spine Laser -->
    <line x1="32" y1="19" x2="32" y2="49" stroke="url(#amberCore)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="32" y1="22" x2="32" y2="45" stroke="#FFF7D6" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Apex Diamond Spark (Neural Apex) -->
    <polygon points="32,8 35.5,14 32,20 28.5,14" fill="#FFC15E"/>
    <!-- Specular Highlight Dot -->
    <circle cx="32" cy="14" r="1.4" fill="#FFFFFF"/>

    <!-- Bottom Anchor Vertex Dot -->
    <circle cx="32" cy="49" r="2.2" fill="#FF9A2E"/>
    <circle cx="32" cy="49" r="1" fill="#FFF7D6"/>
  </g>
</svg>